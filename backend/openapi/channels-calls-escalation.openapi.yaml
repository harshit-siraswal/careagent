openapi: 3.1.0
info:
  title: CareAgent Channels, Calls, and Escalation API
  version: 0.1.0
  summary: Contracts for verified channels, delivery dispatch, provider webhooks, escalation runs, and emergency simulations.
servers:
  - url: https://api.careagent.example
security:
  - bearerAuth: []
paths:
  /patients/{patient_id}/channel-links:
    get:
      operationId: listChannelLinks
      summary: List verified and pending channel links for a patient.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Channel links.
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChannelLink"
    post:
      operationId: createChannelLink
      summary: Start account/contact verification for WhatsApp, Telegram, push, SMS, voice, or email.
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelLinkRequest"
      responses:
        "202":
          description: Verification challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelLink"
  /patients/{patient_id}/channel-links/{link_id}/verify:
    post:
      operationId: verifyChannelLink
      summary: Complete a channel verification challenge.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/LinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_code]
              properties:
                verification_code:
                  type: string
                  minLength: 4
                  maxLength: 12
      responses:
        "200":
          description: Verified link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelLink"
  /channel-templates:
    get:
      operationId: listChannelTemplates
      summary: List versioned message templates and WhatsApp provider approval metadata.
      parameters:
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: approval_status
          in: query
          schema:
            $ref: "#/components/schemas/TemplateApprovalStatus"
        - name: template_kind
          in: query
          schema:
            $ref: "#/components/schemas/TemplateKind"
      responses:
        "200":
          description: Template registry entries.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageTemplate"
  /call-scripts:
    get:
      operationId: listCallScripts
      summary: List approved and draft voice scripts with AI disclosure validation state.
      parameters:
        - name: approval_status
          in: query
          schema:
            $ref: "#/components/schemas/ScriptApprovalStatus"
        - name: script_kind
          in: query
          schema:
            type: string
            enum: [critical_caretaker, doctor_escalation, ambulance_contact, emergency_simulation]
      responses:
        "200":
          description: Call script registry entries.
          content:
            application/json:
              schema:
                type: object
                required: [scripts]
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CallScript"
  /provider-capabilities:
    get:
      operationId: listProviderCapabilities
      summary: List configured provider adapters, feature support, and production eligibility.
      parameters:
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: Provider capability registry.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderCapability"
  /patients/{patient_id}/channel-messages:
    post:
      operationId: sendChannelMessage
      summary: Dispatch a policy-approved message or call through a provider abstraction.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRequest"
      responses:
        "202":
          description: Dispatch attempt accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchAttempt"
        "403":
          description: Policy denied the external action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risk-events/{risk_event_id}/escalate:
    post:
      operationId: startEscalation
      summary: Start or retrieve an idempotent escalation run for a risk event.
      parameters:
        - $ref: "#/components/parameters/RiskEventId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEscalationRequest"
      responses:
        "202":
          description: Escalation run started or already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationRun"
  /escalation-runs/{run_id}:
    get:
      operationId: getEscalationRun
      summary: Get escalation run status, actions, receipts, and acknowledgements.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Escalation run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationRun"
  /escalation-runs/{run_id}/acknowledge:
    post:
      operationId: acknowledgeEscalationRun
      summary: Acknowledge an escalation through app, dashboard, Telegram, WhatsApp, or voice callback.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgementRequest"
      responses:
        "200":
          description: Acknowledgement recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acknowledgement"
  /patients/{patient_id}/emergency-simulations:
    post:
      operationId: startEmergencySimulation
      summary: Run a full escalation drill through simulator providers only.
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSimulationRequest"
      responses:
        "202":
          description: Simulation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencySimulation"
  /emergency-simulations/{simulation_id}:
    get:
      operationId: getEmergencySimulation
      summary: Get emergency drill status and expected-vs-actual steps.
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Simulation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencySimulation"
  /webhooks/whatsapp:
    post:
      operationId: whatsappWebhook
      summary: Receive WhatsApp Cloud API or BSP inbound messages and delivery receipts.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Accepted.
  /webhooks/telegram:
    post:
      operationId: telegramWebhook
      summary: Receive Telegram Bot API updates.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Accepted.
  /webhooks/voice:
    post:
      operationId: voiceWebhook
      summary: Receive programmable voice status, DTMF, and speech callbacks.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Accepted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webhookSignature:
      type: apiKey
      in: header
      name: X-CareAgent-Signature
  parameters:
    PatientId:
      name: patient_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: link_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RiskEventId:
      name: risk_event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  schemas:
    Channel:
      type: string
      enum: [push, in_app, whatsapp, telegram, sms, voice, email]
    ProviderKind:
      type: string
      enum: [fcm_apns, whatsapp_cloud, whatsapp_bsp, prototype_whatsapp_web, telegram_bot, sms_provider, voice_provider, simulation]
    VerificationStatus:
      type: string
      enum: [unverified, pending, verified, failed]
    ConsentStatus:
      type: string
      enum: [not_required, missing, active, revoked, expired]
    TemplateApprovalStatus:
      type: string
      enum: [draft, pending_provider_approval, approved, rejected, paused, disabled, superseded]
    ScriptApprovalStatus:
      type: string
      enum: [draft, approved, disabled, superseded]
    TemplateKind:
      type: string
      enum:
        - medicine_reminder
        - missed_dose_caretaker
        - daily_summary_caretaker
        - device_disconnected
        - urgent_vitals_alert
        - critical_escalation_caretaker
        - doctor_escalation_summary
        - emergency_services_summary
        - account_verification
        - emergency_simulation_notice
        - verification_success
        - high_risk_patient_checkin
        - escalation_cancelled
    ProviderCapability:
      type: object
      required: [provider, channel, production_eligible, supports_delivery_receipts, supports_buttons, supports_media_uploads]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderKind"
        channel:
          $ref: "#/components/schemas/Channel"
        provider_account_id:
          type: string
        production_eligible:
          type: boolean
        prototype_only:
          type: boolean
          default: false
        supports_delivery_receipts:
          type: boolean
        supports_read_receipts:
          type: boolean
        supports_buttons:
          type: boolean
        supports_media_uploads:
          type: boolean
        supports_location:
          type: boolean
        supported_locales:
          type: array
          items:
            type: string
    ChannelLink:
      type: object
      required: [id, patient_id, channel, external_subject_ref, verification_status, commands_enabled, uploads_enabled]
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        user_account_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/Channel"
        external_subject_ref:
          type: string
        verification_status:
          $ref: "#/components/schemas/VerificationStatus"
        verification_method:
          type: string
          enum: [otp, app_deep_link, signed_link, provider_token]
        consent_status:
          $ref: "#/components/schemas/ConsentStatus"
        capabilities:
          type: array
          items:
            type: string
            enum: [chat, uploads, reminders, alerts, calls, acknowledgements]
        commands_enabled:
          type: boolean
        uploads_enabled:
          type: boolean
        locked_until:
          type: string
          format: date-time
        blocked_reason:
          type: string
        verified_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CreateChannelLinkRequest:
      type: object
      required: [channel, external_subject_ref, verification_method]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        contact_id:
          type: string
          format: uuid
        user_account_id:
          type: string
          format: uuid
        external_subject_ref:
          type: string
        verification_method:
          type: string
          enum: [otp, app_deep_link, signed_link, provider_token]
        requested_capabilities:
          type: array
          items:
            type: string
            enum: [chat, uploads, reminders, alerts, calls, acknowledgements]
        locale:
          type: string
          default: en-IN
        challenge_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
    MessageTemplate:
      type: object
      required: [id, version, template_kind, channels, locale, approval_status, required_variables, business_initiated]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        template_kind:
          $ref: "#/components/schemas/TemplateKind"
        channels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Channel"
        locale:
          type: string
        approval_status:
          $ref: "#/components/schemas/TemplateApprovalStatus"
        provider_template_name:
          type: string
          description: Approved WhatsApp Cloud/BSP template name when the channel requires provider approval.
        business_initiated:
          type: boolean
        contains_phi:
          type: boolean
        required_variables:
          type: array
          items:
            type: string
        optional_variables:
          type: array
          items:
            type: string
        compliance_reviewed_at:
          type: string
          format: date-time
        provider_approved_at:
          type: string
          format: date-time
        superseded_by:
          type: string
    CallScript:
      type: object
      required: [id, version, script_kind, locale, approval_status, ai_disclosure_present, allowed_variables, body_template]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1
        script_kind:
          type: string
          enum: [critical_caretaker, doctor_escalation, ambulance_contact, emergency_simulation]
        locale:
          type: string
        approval_status:
          $ref: "#/components/schemas/ScriptApprovalStatus"
        ai_disclosure_present:
          type: boolean
        opening_text:
          type: string
        body_template:
          type: string
        allowed_variables:
          type: array
          items:
            type: string
        dtmf_menu:
          type: array
          items:
            type: object
            required: [digit, action]
            properties:
              digit:
                type: string
                pattern: "^[0-9#*]$"
              action:
                type: string
                enum: [acknowledge, repeat, request_callback, transfer_configured_contact, end_call]
        recording_allowed:
          type: boolean
          default: false
        compliance_reviewed_at:
          type: string
          format: date-time
    DispatchRequest:
      type: object
      required: [channel, variables, reason, policy_decision_id]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        provider_preference:
          $ref: "#/components/schemas/ProviderKind"
        contact_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        escalation_run_id:
          type: string
          format: uuid
        escalation_action_id:
          type: string
          format: uuid
        template_id:
          type: string
        template_version:
          type: integer
          minimum: 1
        script_id:
          type: string
        script_version:
          type: integer
          minimum: 1
        locale:
          type: string
          default: en-IN
        variables:
          type: object
          additionalProperties:
            type: string
        media_refs:
          type: array
          items:
            type: object
            required: [type, ref]
            properties:
              type:
                type: string
                enum: [image, document, location]
              ref:
                type: string
        reason:
          type: string
        policy_decision_id:
          type: string
        business_initiated:
          type: boolean
          default: false
        service_window_expires_at:
          type: string
          format: date-time
        simulation:
          type: boolean
          default: false
    DispatchAttempt:
      type: object
      required: [id, patient_id, channel, status, simulation]
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/Channel"
        provider:
          $ref: "#/components/schemas/ProviderKind"
        template_id:
          type: string
        script_id:
          type: string
        status:
          type: string
          enum: [queued, policy_denied, provider_pending, sent, delivered, read, answered, acknowledged, failed, cancelled, expired, simulated]
        status_reason:
          type: string
        attempt_number:
          type: integer
          minimum: 1
        max_attempts:
          type: integer
          minimum: 1
        provider_message_id:
          type: string
        provider_call_id:
          type: string
        error:
          $ref: "#/components/schemas/ProviderError"
        next_attempt_at:
          type: string
          format: date-time
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryReceipt"
        simulation:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderError:
      type: object
      required: [error_code, retry_class]
      properties:
        error_code:
          type: string
        retry_class:
          type: string
          enum: [retryable, hard_failure, policy_denied, template_blocked, recipient_unreachable, rate_limited]
        safe_user_message:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 0
    DeliveryReceipt:
      type: object
      required: [id, dispatch_attempt_id, normalized_status, occurred_at, received_at, signature_valid]
      properties:
        id:
          type: string
          format: uuid
        dispatch_attempt_id:
          type: string
          format: uuid
        provider_event_id:
          type: string
        provider_status:
          type: string
        normalized_status:
          type: string
          enum: [accepted, queued, sent, delivered, read, ringing, answered, completed, acknowledged, busy, no_answer, failed, expired, token_invalid]
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        signature_valid:
          type: boolean
        monotonic_precedence:
          type: integer
          minimum: 0
        raw_payload_ref:
          type: string
        redacted_summary:
          type: object
          additionalProperties: true
    StartEscalationRequest:
      type: object
      required: [requested_by, policy_id]
      properties:
        requested_by:
          type: string
          enum: [system, agent, background_worker, user]
        policy_id:
          type: string
          format: uuid
        policy_decision_id:
          type: string
        emergency_service_approved:
          type: boolean
          default: false
        simulation:
          type: boolean
          default: false
        evidence_snapshot:
          type: object
          additionalProperties: true
    EscalationRun:
      type: object
      required: [id, patient_id, risk_event_id, policy_id, status, actions]
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        risk_event_id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        policy_decision_id:
          type: string
        status:
          type: string
          enum: [pending, running, awaiting_ack, acknowledged, completed, failed, cancelled]
        outcome:
          type: string
        simulation:
          type: boolean
          default: false
        evidence_snapshot_ref:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/EscalationAction"
        acknowledgements:
          type: array
          items:
            $ref: "#/components/schemas/Acknowledgement"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EscalationAction:
      type: object
      required: [id, step_order, action_type, channel, status]
      properties:
        id:
          type: string
          format: uuid
        step_order:
          type: integer
        action_type:
          type: string
          enum: [send_message, place_call, push_notification, wait_for_ack, share_location, cancel_notice]
        channel:
          $ref: "#/components/schemas/Channel"
        contact_id:
          type: string
          format: uuid
        contact_role:
          type: string
          enum: [patient, primary_caretaker, secondary_caretaker, nurse, doctor, ambulance_contact, public_emergency_number]
        provider:
          $ref: "#/components/schemas/ProviderKind"
        template_id:
          type: string
        script_id:
          type: string
        ack_timeout_seconds:
          type: integer
          minimum: 0
        retry_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, attempting, sent, delivered, answered, acknowledged, failed, skipped, cancelled]
        skip_reason:
          type: string
          enum: [consent_missing, consent_revoked, channel_unverified, quiet_hours_blocked, template_unapproved, provider_unavailable, region_policy_denied, simulation_blocked, production_provider_required, duplicate_suppressed]
        dispatch_attempts:
          type: array
          items:
            $ref: "#/components/schemas/DispatchAttempt"
    AcknowledgementRequest:
      type: object
      required: [acknowledgement_method]
      properties:
        escalation_action_id:
          type: string
          format: uuid
        acknowledged_by_contact_id:
          type: string
          format: uuid
        acknowledged_by_user_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/Channel"
        acknowledgement_method:
          type: string
          enum: [app_button, dashboard_button, whatsapp_button, telegram_callback, voice_dtmf, voice_speech]
        response_payload:
          type: object
          additionalProperties: true
    Acknowledgement:
      type: object
      required: [id, escalation_run_id, acknowledgement_method, acknowledged_at, verified_actor]
      properties:
        id:
          type: string
          format: uuid
        escalation_run_id:
          type: string
          format: uuid
        escalation_action_id:
          type: string
          format: uuid
        acknowledgement_method:
          type: string
        acknowledged_at:
          type: string
          format: date-time
        verified_actor:
          type: boolean
        source_dispatch_attempt_id:
          type: string
          format: uuid
    StartSimulationRequest:
      type: object
      required: [scenario_key, escalation_policy_id]
      properties:
        scenario_key:
          type: string
        escalation_policy_id:
          type: string
          format: uuid
        assertion_mode:
          type: string
          enum: [strict, allow_extra_non_external_audit_events]
          default: strict
        block_production_providers:
          type: boolean
          default: true
        synthetic_risk_event:
          type: object
          additionalProperties: true
        provider_behaviors:
          type: array
          items:
            type: object
            required: [channel, behavior]
            properties:
              channel:
                $ref: "#/components/schemas/Channel"
              provider:
                $ref: "#/components/schemas/ProviderKind"
              contact_role:
                type: string
                enum: [patient, primary_caretaker, secondary_caretaker, nurse, doctor, ambulance_contact, public_emergency_number]
              behavior:
                type: string
                enum: [deliver, fail, timeout, answer, acknowledge]
              delay_seconds:
                type: integer
                minimum: 0
    EmergencySimulation:
      type: object
      required: [id, patient_id, scenario_key, status]
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        scenario_key:
          type: string
        status:
          type: string
          enum: [queued, running, passed, failed, cancelled]
        expected_steps:
          type: array
          items:
            type: object
            additionalProperties: true
        actual_summary:
          type: object
          additionalProperties: true
        assertion_results:
          type: array
          items:
            type: object
            required: [name, passed]
            properties:
              name:
                type: string
              passed:
                type: boolean
              detail:
                type: string
        production_provider_invocations:
          type: integer
          minimum: 0
        simulator_provider_account_id:
          type: string
