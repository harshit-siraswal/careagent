openapi: 3.1.0
info:
  title: CareAgent Document Intelligence API
  version: 0.1.0
  summary: Upload, OCR, extraction, review, medicine activation, and source-grounded document Q&A contracts.
  description: >
    Document text and OCR snippets are untrusted evidence. Backend policy must
    enforce patient-scoped authorization, consent, malware-scan gating,
    provenance requirements, review gates, and audit logging before any
    extracted fact is used for reminders, summaries, or agent answers.
servers:
  - url: https://api.careagent.example/v1
security:
  - bearerAuth: []
tags:
  - name: Documents
  - name: OCR
  - name: Extraction
  - name: Review
  - name: DocumentQnA

paths:
  /patients/{patient_id}/documents:
    get:
      tags: [Documents]
      operationId: listPatientDocuments
      summary: List documents visible to the current actor for one patient.
      x-required-permission: documents:read
      x-patient-scope: patient_id
      x-audit: documents.list_viewed
      x-phi: true
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: document_type
          in: query
          schema:
            $ref: "#/components/schemas/DocumentType"
        - name: review_status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        default:
          $ref: "#/components/responses/Error"

  /patients/{patient_id}/documents/upload-sessions:
    post:
      tags: [Documents]
      operationId: createDocumentUploadSession
      summary: Create a signed upload session for a document or medicine photo.
      description: >
        The raw file must be uploaded to object storage using the returned
        target. Processing remains blocked until upload completion, checksum
        verification, and a clean malware scan.
      x-required-permission: documents:write
      x-patient-scope: patient_id
      x-audit: document.upload_session_created
      x-idempotent: required
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionRequest"
      responses:
        "201":
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        default:
          $ref: "#/components/responses/Error"

  /patients/{patient_id}/documents/{document_id}/upload-complete:
    post:
      tags: [Documents]
      operationId: completeDocumentUpload
      summary: Confirm object upload completion and enqueue malware scan.
      x-required-permission: documents:write
      x-patient-scope: patient_id
      x-audit: document.upload_completed
      x-idempotent: required
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, file_size_bytes]
              properties:
                sha256:
                  type: string
                file_size_bytes:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: Processing accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalDocument"
        default:
          $ref: "#/components/responses/Error"

  /patients/{patient_id}/documents/{document_id}:
    get:
      tags: [Documents]
      operationId: getDocumentDetail
      summary: Get document metadata, processing status, extracted facts, and review tasks.
      x-required-permission: documents:read
      x-patient-scope: patient_id
      x-audit: document.viewed
      x-phi: true
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetailResponse"
        default:
          $ref: "#/components/responses/Error"

  /patients/{patient_id}/documents/{document_id}/ocr:
    get:
      tags: [OCR]
      operationId: getDocumentOcr
      summary: Get OCR pages, blocks, quality flags, and detected language.
      description: >
        OCR text is returned only to authorized review surfaces. Agent runtime
        should receive fact snippets or reviewed facts rather than full raw OCR.
      x-required-permission: documents:read
      x-patient-scope: patient_id
      x-audit: document.ocr_viewed
      x-phi: true
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/DocumentId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OCR pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrPageResponse"
        default:
          $ref: "#/components/responses/Error"

  /patients/{patient_id}/documents/{document_id}/review:
    post:
      tags: [Review]
      operationId: reviewExtractedFacts
      summary: Approve, correct, reject, or mark extracted facts unreadable.
      description: >
        High-impact facts such as medicine schedules, allergies, diagnoses,
        follow-up instructions, and critical lab values require review before
        they become patient truth. Corrections preserve the original extracted
        value and create audit events.
      x-required-permission: documents:write
      x-patient-scope: patient_id
      x-audit: document.extraction_reviewed
      x-phi: true
      x-idempotent: recommended
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Updated facts and document review status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetailResponse"
        default:
          $ref: "#/components/responses/Error"

  /patients/{patient_id}/documents/{document_id}/medicine-activations:
    post:
      tags: [Review]
      operationId: activateReviewedMedicineSchedules
      summary: Create active medicine schedules from reviewed prescription or discharge medicine proposals.
      description: >
        This endpoint must deny activation if any requested medicine proposal is
        unreviewed, rejected, low-confidence without correction, or in conflict
        without explicit reviewer resolution.
      x-required-permission: medicines:write
      x-patient-scope: patient_id
      x-audit: document.medicine_schedule_activated
      x-phi: true
      x-idempotent: required
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineActivationRequest"
      responses:
        "201":
          description: Medicine schedules created or returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicineActivationResponse"
        default:
          $ref: "#/components/responses/Error"

  /patients/{patient_id}/document-questions:
    post:
      tags: [DocumentQnA]
      operationId: answerDocumentQuestion
      summary: Ask a source-grounded question over reviewed patient document facts.
      description: >
        Answers must cite sources, use patient-scoped retrieval, exclude rejected
        facts, disclose missing/stale/low-confidence evidence, and refuse unsafe
        diagnosis or medication-change requests.
      x-required-permission: documents:read
      x-patient-scope: patient_id
      x-audit: document.question_answered
      x-phi: true
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentQuestionRequest"
      responses:
        "200":
          description: Source-grounded answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentQuestionResponse"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PatientId:
      name: patient_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Channel:
      type: string
      enum: [app, whatsapp, telegram, admin_upload, system_import]
    DocumentType:
      type: string
      enum:
        - prescription
        - lab_report
        - discharge_summary
        - medicine_photo
        - doctor_note
        - imaging_report
        - hospital_bill_or_slip
        - unknown
    ProcessingStatus:
      type: string
      enum: [created, queued, running, blocked, completed, partial, failed, cancelled, needs_user_action]
    MalwareScanStatus:
      type: string
      enum: [pending, clean, infected, failed, quarantined]
    ReviewStatus:
      type: string
      enum: [not_required, pending, approved, corrected, rejected, superseded]
    UploadSessionRequest:
      type: object
      required: [original_filename, file_type, file_size_bytes, sha256, upload_channel]
      properties:
        original_filename:
          type: string
          maxLength: 255
        file_type:
          type: string
          examples: [application/pdf, image/jpeg]
        file_size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
        upload_channel:
          $ref: "#/components/schemas/Channel"
        document_type_hint:
          $ref: "#/components/schemas/DocumentType"
        source_message_id:
          type: string
        locale_hint:
          type: string
          examples: [en-IN, hi-IN]
    UploadSessionResponse:
      type: object
      required: [document, upload]
      properties:
        document:
          $ref: "#/components/schemas/MedicalDocument"
        upload:
          $ref: "#/components/schemas/DirectUploadTarget"
    DirectUploadTarget:
      type: object
      required: [method, url, expires_at, headers]
      properties:
        method:
          type: string
          enum: [PUT, POST]
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
    DocumentListResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/MedicalDocument"
    MedicalDocument:
      type: object
      required:
        - id
        - patient_id
        - uploaded_by
        - upload_channel
        - original_filename
        - file_type
        - file_size_bytes
        - sha256
        - document_type
        - malware_scan_status
        - ocr_status
        - classification_status
        - extraction_status
        - review_status
        - index_status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        uploaded_by:
          type: string
          format: uuid
        upload_channel:
          $ref: "#/components/schemas/Channel"
        original_filename:
          type: string
        file_type:
          type: string
        file_size_bytes:
          type: integer
        sha256:
          type: string
        document_type:
          $ref: "#/components/schemas/DocumentType"
        document_date:
          type: string
          format: date
        source_organization:
          type: string
        patient_name_on_document:
          type: string
        malware_scan_status:
          $ref: "#/components/schemas/MalwareScanStatus"
        ocr_status:
          $ref: "#/components/schemas/ProcessingStatus"
        classification_status:
          $ref: "#/components/schemas/ProcessingStatus"
        extraction_status:
          $ref: "#/components/schemas/ProcessingStatus"
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        index_status:
          $ref: "#/components/schemas/ProcessingStatus"
        quality_flags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentDetailResponse:
      type: object
      required: [document, runs, facts]
      properties:
        document:
          $ref: "#/components/schemas/MedicalDocument"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/DocumentProcessingRun"
        facts:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedMedicalFact"
        prescription:
          $ref: "#/components/schemas/PrescriptionExtraction"
        lab_report:
          $ref: "#/components/schemas/LabReportExtraction"
        discharge_summary:
          $ref: "#/components/schemas/DischargeSummaryExtraction"
        medicine_photo:
          $ref: "#/components/schemas/MedicinePhotoExtraction"
    DocumentProcessingRun:
      type: object
      required: [id, document_id, stage, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        stage:
          type: string
          enum: [malware_scan, ocr, classification, extraction, review, indexing]
        status:
          $ref: "#/components/schemas/ProcessingStatus"
        provider:
          type: string
        model_version:
          type: string
        prompt_version:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        blocked_reason:
          type: string
        metrics:
          type: object
          additionalProperties: true
    OcrPageResponse:
      type: object
      required: [document_id, pages]
      properties:
        document_id:
          type: string
          format: uuid
        pages:
          type: array
          items:
            $ref: "#/components/schemas/OcrPage"
    OcrPage:
      type: object
      required: [page_number, language_codes, confidence, blocks]
      properties:
        page_number:
          type: integer
          minimum: 1
        language_codes:
          type: array
          items:
            type: string
        ocr_engine:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        quality_flags:
          type: array
          items:
            type: string
        width_px:
          type: integer
        height_px:
          type: integer
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/OcrBlock"
    OcrBlock:
      type: object
      required: [block_id, kind, text, confidence, bounding_box]
      properties:
        block_id:
          type: string
        kind:
          type: string
          enum: [line, paragraph, table, table_row, table_cell, key_value, image_region]
        text:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        bounding_box:
          $ref: "#/components/schemas/BoundingBox"
    BoundingBox:
      type: object
      required: [x, y, w, h]
      properties:
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
    ExtractedMedicalFact:
      type: object
      required:
        - id
        - document_id
        - patient_id
        - fact_type
        - label
        - value
        - confidence
        - source
        - review_status
        - model_version
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        fact_type:
          type: string
          enum:
            - medicine_name
            - medicine_dose
            - medicine_timing
            - medicine_route
            - medicine_duration
            - medicine_instruction
            - doctor_name
            - document_date
            - lab_value
            - lab_reference_range
            - diagnosis_term
            - allergy
            - follow_up_instruction
            - procedure
            - hospitalization_period
            - free_text_note
        label:
          type: string
        value:
          type:
            - string
            - "null"
        unit:
          type:
            - string
            - "null"
        normalized_value:
          type:
            - number
            - "null"
        normalized_unit:
          type:
            - string
            - "null"
        effective_date:
          type:
            - string
            - "null"
          format: date
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          $ref: "#/components/schemas/FactSource"
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        corrected_value:
          type:
            - string
            - "null"
        missing_reason:
          type:
            - string
            - "null"
        model_version:
          type: string
        prompt_version:
          type: string
    FactSource:
      type: object
      required: [page, block_ids, ocr_confidence]
      properties:
        page:
          type: integer
          minimum: 1
        block_ids:
          type: array
          items:
            type: string
        text_span:
          type: object
          properties:
            start:
              type: integer
            end:
              type: integer
        snippet:
          type: string
        bounding_box:
          $ref: "#/components/schemas/BoundingBox"
        ocr_confidence:
          type: number
          minimum: 0
          maximum: 1
    ReviewRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReviewDecision"
        reviewer_note:
          type: string
    ReviewDecision:
      type: object
      required: [fact_id, review_status]
      properties:
        fact_id:
          type: string
          format: uuid
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        corrected_value:
          type: string
        corrected_unit:
          type: string
        corrected_effective_date:
          type: string
          format: date
        correction_reason:
          type: string
        conflict_resolution:
          type: string
          enum: [keep_existing, replace_existing, keep_both, reject_new, not_applicable]
    MedicineActivationRequest:
      type: object
      required: [medicine_proposal_ids]
      properties:
        medicine_proposal_ids:
          type: array
          minItems: 1
          items:
            type: string
        conflict_resolution:
          type: string
          enum: [keep_existing, replace_existing, keep_both, reject_new]
        reviewer_note:
          type: string
    MedicineActivationResponse:
      type: object
      required: [medicines, schedules, audit_log_id]
      properties:
        medicines:
          type: array
          items:
            type: object
            additionalProperties: true
        schedules:
          type: array
          items:
            type: object
            additionalProperties: true
        audit_log_id:
          type: string
          format: uuid
    PrescriptionExtraction:
      type: object
      properties:
        prescriber:
          type: object
          properties:
            name:
              type: string
            qualification:
              type: string
            registration_number:
              type: string
            clinic:
              type: string
        document_date:
          type: string
          format: date
        diagnosis_terms:
          type: array
          items:
            type: object
            additionalProperties: true
        allergies:
          type: array
          items:
            type: object
            additionalProperties: true
        medicines:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionMedicine"
        follow_up:
          type: array
          items:
            type: object
            additionalProperties: true
    PrescriptionMedicine:
      type: object
      required: [raw_line, name, confidence, activation_status]
      properties:
        proposal_id:
          type: string
        raw_line:
          type: string
        name:
          type:
            - string
            - "null"
        strength:
          type:
            - string
            - "null"
        form:
          type:
            - string
            - "null"
        dose:
          type:
            - string
            - "null"
        route:
          type:
            - string
            - "null"
        timing:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleTiming"
        frequency:
          type:
            - string
            - "null"
        duration:
          type: object
          additionalProperties: true
        special_instructions:
          type:
            - string
            - "null"
        source_fact_ids:
          type: array
          items:
            type: string
            format: uuid
        confidence:
          type: number
          minimum: 0
          maximum: 1
        activation_status:
          type: string
          enum: [requires_review, blocked_conflict, activated, rejected]
    ScheduleTiming:
      type: object
      properties:
        local_time:
          type: string
          examples: ["08:00"]
        local_time_hint:
          type: string
          examples: [morning, afternoon, evening, bedtime]
        with_food:
          type: string
          enum: [before_food, with_food, after_food, unknown]
    LabReportExtraction:
      type: object
      properties:
        lab_name:
          type: string
        report_date:
          type: string
          format: date
        sample_collected_at:
          type: string
          format: date-time
        values:
          type: array
          items:
            $ref: "#/components/schemas/LabValue"
        clinician_interpretation:
          type:
            - string
            - "null"
    LabValue:
      type: object
      required: [test_name, value, unit, confidence, source_fact_ids]
      properties:
        test_name:
          type: string
        loinc_code:
          type:
            - string
            - "null"
        value:
          type: string
        unit:
          type: string
        normalized_value:
          type:
            - number
            - "null"
        normalized_unit:
          type:
            - string
            - "null"
        reference_range:
          type:
            - string
            - "null"
        abnormal_flag:
          type: string
          enum: [low, normal, high, critical_low, critical_high, unknown]
        method:
          type:
            - string
            - "null"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_fact_ids:
          type: array
          items:
            type: string
            format: uuid
    DischargeSummaryExtraction:
      type: object
      properties:
        hospital:
          type: string
        admission_date:
          type: string
          format: date
        discharge_date:
          type: string
          format: date
        primary_diagnoses:
          type: array
          items:
            type: object
            additionalProperties: true
        procedures:
          type: array
          items:
            type: object
            additionalProperties: true
        medicines_on_discharge:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionMedicine"
        allergies:
          type: array
          items:
            type: object
            additionalProperties: true
        follow_up_instructions:
          type: array
          items:
            type: object
            additionalProperties: true
        red_flags:
          type: array
          items:
            type: object
            additionalProperties: true
    MedicinePhotoExtraction:
      type: object
      properties:
        detected_items:
          type: array
          items:
            type: object
            required: [visible_text, confidence, review_required]
            properties:
              visible_text:
                type: string
              name_candidate:
                type:
                  - string
                  - "null"
              strength_candidate:
                type:
                  - string
                  - "null"
              brand_candidate:
                type:
                  - string
                  - "null"
              expiry_date:
                type:
                  - string
                  - "null"
              batch_number:
                type:
                  - string
                  - "null"
              confidence:
                type: number
                minimum: 0
                maximum: 1
              review_required:
                type: boolean
    DocumentQuestionRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        allowed_document_ids:
          type: array
          items:
            type: string
            format: uuid
        include_pending_facts:
          type: boolean
          default: false
        locale:
          type: string
          default: en-IN
    DocumentQuestionResponse:
      type: object
      required: [answer, citations, missing_or_stale_disclosures, audit_log_id]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        missing_or_stale_disclosures:
          type: array
          items:
            type: string
