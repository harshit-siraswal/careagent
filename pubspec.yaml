name: careagent
description: Android-first CareAgent MVP shell.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  google_sign_in: ^6.2.2
  http: ^1.3.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  flutter_3d_controller: ^2.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/
